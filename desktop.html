<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NATRO – søvnrutine og vækning</title>
<link rel="icon" href="icons/icon-192.png">
<script>if(!matchMedia('(min-width: 600px) and (min-height: 700px)').matches) location.replace('index.html?app');</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;
  background:radial-gradient(circle at 30% 20%,#141f4a,#000);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;color:#e6eaff}
.phone{position:relative;width:393px;height:852px;max-height:calc(100vh - 48px);flex-shrink:0;border-radius:60px;
  border:12px solid #1a1a1a;background:#0b1230;box-shadow:0 0 0 2px #3a3a3a,0 30px 80px rgba(0,0,0,.35);overflow:hidden}
.phone iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#0b1230}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:122px;height:36px;border-radius:20px;background:#000;z-index:30}
.status-bar{display:flex;position:absolute;top:0;left:0;right:0;height:54px;padding:0 30px 0 44px;align-items:center;
  justify-content:space-between;font-size:16px;font-weight:600;z-index:20;pointer-events:none}
.status-icons{display:flex;gap:6px;align-items:center}
.status-icons svg{height:12px;fill:currentColor}
.home-indicator{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:#e6eaff;z-index:30;pointer-events:none}
</style>
</head>
<body>
<div class="phone">
  <iframe src="index.html?app" title="NATRO"></iframe>
  <div class="island"></div>
  <div class="status-bar">
    <span id="clock">9:41</span>
    <span class="status-icons">
      <svg viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2.5" width="3" height="9.5" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
      <svg viewBox="0 0 16 12"><path d="M8 2.5a9 9 0 0 1 6.4 2.6l1.1-1.1A10.6 10.6 0 0 0 8 1 10.6 10.6 0 0 0 .5 4l1.1 1.1A9 9 0 0 1 8 2.5zm0 3.2a5.8 5.8 0 0 1 4.1 1.7l1.1-1.1A7.4 7.4 0 0 0 8 4.2a7.4 7.4 0 0 0-5.2 2.1l1.1 1.1A5.8 5.8 0 0 1 8 5.7zM8 9a2.4 2.4 0 0 0-1.7.7L8 11.5l1.7-1.8A2.4 2.4 0 0 0 8 9z"/></svg>
      <svg viewBox="0 0 27 12"><rect x="0.5" y="0.5" width="23" height="11" rx="3" fill="none" stroke="currentColor" opacity="0.4"/><rect x="2" y="2" width="20" height="8" rx="1.8"/><rect x="24.5" y="4" width="2" height="4" rx="1" opacity="0.4"/></svg>
    </span>
  </div>
  <div class="home-indicator"></div>
</div>
<script>
function updateClock(){const n=new Date();document.getElementById('clock').textContent=n.getHours()+':'+String(n.getMinutes()).padStart(2,'0')}
updateClock();setInterval(updateClock,10000);
</script>
</body>
</html>
